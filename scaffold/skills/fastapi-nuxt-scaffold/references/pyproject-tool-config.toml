# Append this whole file to the pyproject.toml that `uv init` + `uv add` produce.
# Deliberately contains NO dependency versions -- those come from `uv add`/`uv add --dev`
# and are uv's job to resolve and pin in the lockfile, not something to hand-write here.

# App run from source (imports like `from lib.database import ...`), not an installable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 120
# Alembic writes `migrations/versions/*` from its own template (`Union[str, None]`, unsorted
# imports, long autogenerated lines). mypy already excludes the directory; ruff matches it, so
# a fresh `alembic revision --autogenerate` never lands the repo in a red state.
extend-exclude = ["migrations/"]
# No target-version pin -- ruff infers it from [project] requires-python (which `uv init`/
# `uv add` maintain), so this doesn't go stale the way a hand-written pin would.
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI markers are called in argument defaults (`x: T = Depends(...)`); exempt them
# from B008 while keeping B008 active for real function-call-in-default bugs.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped async fixtures (the test database engine) must share the loop the tests run
# on. Leaving these at pytest-asyncio's per-function default gives every test a fresh loop and
# the shared engine then raises "attached to a different loop" on its first query.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
